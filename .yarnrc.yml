nodeLinker: node-modules

# Hardened mode quarantines prereleases published within the last ~7 days as
# supply-chain protection. We're on Baileys 7 RC, which gets new prereleases
# weekly, so we opt out.
enableHardenedMode: false

approvedGitRepositories:
  - "https://github.com/whiskeysockets/*"
  - "https://github.com/WhiskeySockets/*"
